# WPS integration for SuiteCRM 7 without access to the vhost: the block goes to the TOP of .htaccess in the CRM root,
# BEFORE "# BEGIN SUITECRM RESTRICTIONS". Requires mod_rewrite and "AllowOverride All" (or FileInfo + Options).
# Why the top: SuiteCRM keeps everything above that marker when it regenerates .htaccess
# (Admin → Repair → Rebuild .htaccess File), and the block must run before the generated deprecated rule
# "RewriteRule ^api/(.*?)$ lib/API/public/index.php/$1 [L]", which would otherwise take /api/v9/... .
# bin/install.sh --htaccess adds exactly this block; bin/uninstall.sh --htaccess removes it.

# BEGIN WPS integration: /api/v9/{module}[/{id}] -> wpsApi entry point (query string is kept)
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule ^api/v9/(.*)$ index.php?entryPoint=wpsApi&wps_path=$1 [L,QSA]
</IfModule>
# END WPS integration
